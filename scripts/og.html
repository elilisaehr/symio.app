<!doctype html>
<!-- Source of public/og.png (1200x630 share image). Render with a headless browser at 1200x630, e.g.
     npx playwright screenshot --viewport-size=1200,630 file://$PWD/scripts/og.html public/og.png -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Outfit"; src: url("../node_modules/@fontsource-variable/outfit/files/outfit-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; overflow: hidden; background: #f3f3f8; font-family: "Outfit", sans-serif; color: #17162b; position: relative; }
  .copy { position: absolute; left: 80px; top: 92px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 34px; font-weight: 600; letter-spacing: -0.04em; }
  .brand img { width: 60px; height: 60px; border-radius: 14px; }
  h1 { margin-top: 56px; font-size: 76px; line-height: 1.02; font-weight: 600; letter-spacing: -0.035em; }
  p { margin-top: 28px; font-size: 29px; line-height: 1.4; color: #57566f; max-width: 540px; }
  .panel { position: absolute; right: 56px; top: 48px; width: 440px; height: 640px; border-radius: 40px; background: #e4e4fb; overflow: hidden; }
  .phone { position: absolute; background: #0e0e16; padding: 7px; border-radius: 30px; box-shadow: 0 30px 60px -24px rgba(40,40,110,.35); }
  .phone img { display: block; width: 100%; border-radius: 24px; }
  .back { width: 230px; left: 30px; top: 92px; transform: rotate(-6deg); }
  .front { width: 250px; right: 26px; top: 52px; }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../app/apple-icon.png" alt="">Symio</div>
    <h1>Note ta journée en un tap.</h1>
    <p>L’app iPhone gratuite pour suivre tes symptômes et tes traitements. Sans compte, tout reste sur ton iPhone.</p>
  </div>
  <div class="panel">
    <div class="phone back"><img src="../design/app-screens/light/03-rapports.png" alt=""></div>
    <div class="phone front"><img src="../design/app-screens/light/02-check-in.png" alt=""></div>
  </div>
</body>
</html>
