# Builds the static site and uploads it to Infomaniak over SFTP.
# Manual only for now (Actions tab → Run workflow), until hosting on Infomaniak is confirmed.
# To deploy on every push to main, add under `on:`:  push: { branches: [main] }
#
# Repository secrets to add (GitHub → Settings → Secrets and variables → Actions):
#   INFOMANIAK_SFTP_HOST      e.g. xxxx.ftp.infomaniak.com
#   INFOMANIAK_SFTP_USER      FTP/SSH user of the hosting
#   INFOMANIAK_SFTP_PASSWORD  its password
#   INFOMANIAK_SFTP_PATH      site folder on the server, e.g. /sites/symio.ch
name: Deploy to Infomaniak

on:
  workflow_dispatch:

concurrency:
  group: deploy-infomaniak
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Check the export
        run: |
          test -f out/index.html
          test -f out/.htaccess
          test -f out/confidentialite/index.html
          test -f out/mentions-legales/index.html

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload over SFTP
        env:
          HOST: ${{ secrets.INFOMANIAK_SFTP_HOST }}
          USER: ${{ secrets.INFOMANIAK_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.INFOMANIAK_SFTP_PASSWORD }}
          REMOTE: ${{ secrets.INFOMANIAK_SFTP_PATH }}
        run: |
          test -n "$HOST" && test -n "$USER" && test -n "$LFTP_PASSWORD" && test -n "$REMOTE" || { echo "Missing Infomaniak secrets"; exit 1; }
          # The password is read from LFTP_PASSWORD (--env-password), so special characters are safe.
          # --delete removes files that no longer exist in the site; dotfiles (.htaccess) are included.
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            open --env-password -u \"$USER\" sftp://$HOST;
            mirror --reverse --delete --verbose --parallel=4 out/ \"$REMOTE\";
          "
